services:
  # -------------------------------------------------------------
  # Messaging System & Avro Schema Registry Ecosystem
  # -------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - spark-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - spark-network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy # Wait until Kafka is fully listening and healthy
    ports:
      - "8081:8081" # Exposes Schema Registry directly to host tools
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'PLAINTEXT://kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: 'http://0.0.0.0:8081'
    networks:
      - spark-network

  # ==========================================
  # OpenSearch 3.x Service
  # ==========================================
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: opensearch-node
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin!Password-123
      #- DISABLE_SECURITY_PLUGIN=true # Keep security disabled for dev local cluster
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200" # REST API endpoint
      - "9600:9600" # Performance Analyzer
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "curl --insecure -u 'admin:Admin!Password-123' https://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # OpenSearch Dashboards 3.x (Web UI)
  # ==========================================
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=Admin!Password-123
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
      #- DISABLE_SECURITY_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - spark-network

  # ==========================================
  # Apache Spark 4 Master
  # ==========================================
  spark-master:
    image: apache/spark:4.2.0
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    volumes:
      - ./target/scala-2.13:/opt/spark/apps
      - spark-master-logs:/opt/spark/logs
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - spark-network

  # ==========================================
  # Apache Spark 4 Worker
  # ==========================================
  spark-worker:
    image: apache/spark:4.2.0
    container_name: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8088"]
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=512M
    volumes:
      - spark-worker-logs:/opt/spark/logs
    depends_on:
      - spark-master
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge

volumes:
  opensearch-data:
    driver: local
  spark-master-logs:
    driver: local
  spark-worker-logs:
    driver: local
